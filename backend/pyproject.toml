[project]
name = "vena-lite"
version = "0.1.0"
description = "Lightweight financial planning tool — Excel + DuckDB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "duckdb>=0.10",
  "pandas>=2.2",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "httpx>=0.27",
  "ruff>=0.4",
  "pydantic-to-typescript>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vena_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: Depends() in default arg is the documented usage pattern.
"src/vena_lite/api/*.py" = ["B008"]
